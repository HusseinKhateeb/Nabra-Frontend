name: nabra_frontend
description: Nabra Flutter frontend scaffold (Auth, Sessions, Lip Reading, Chat, Dictionary, Admin)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🎙️ Audio recording
  record: ^5.0.4
  path_provider: ^2.1.2

  # 💬 Realtime chat
  stomp_dart_client: ^1.0.1

  # 🌍 Localization & dates
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # 🔐 Auth
  google_sign_in: ^6.2.1

  # 🌐 Networking
  dio: ^5.7.0

  # 🧠 State management
  flutter_riverpod: ^2.6.1

  # 🧭 Routing
  go_router: ^14.6.2

  # 🔒 Secure token storage
  flutter_secure_storage: ^9.2.2

  # 📷 Media (lip-reading + voice)
  camera: ^0.11.0+2

  # 🧰 Utils
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ▶️ VIDEO PLAYER (ضروري للقاموس البصري)
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed_annotation: ^2.4.1
  build_runner: ^2.4.9
  freezed: ^2.4.2
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/
    - lib/assets/icons/
    - lib/assets/translations/

  # Enable Flutter's gen-l10n (you can add arb files later)
  generate: true
